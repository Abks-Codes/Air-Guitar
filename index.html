<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Air Guitar</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Background Guitar Wallpaper -->
    <div class="guitar-bg"></div>

    <main class="app-container">
      <!-- Title Header Matching Reference Mockup -->
      <header class="header">
        <div class="title-frame">
          <h1 class="main-title">
            <span class="title-air">AIR</span><span class="title-guitar">GUITAR</span>
          </h1>
        </div>
      </header>

      <!-- Center Stage: Webcam Flanked By Floating Musical Notes -->
      <div class="stage-wrapper">
        <!-- Left Side Musical Notes -->
        <div class="side-notes left-notes">
          <img src="note.png" class="ambient-note note-l1" alt="note">
          <img src="note.png" class="ambient-note note-l2" alt="note">
        </div>

        <!-- Central Webcam Display with Rounded Border -->
        <div class="webcam-box">
          <canvas id="view" width="640" height="480"></canvas>
          <div class="empty" id="videoEmpty">
            <p>Click "Start camera" to play</p>
          </div>
        </div>

        <!-- Right Side Musical Notes -->
        <div class="side-notes right-notes">
          <img src="note.png" class="ambient-note note-r1" alt="note">
          <img src="note.png" class="ambient-note note-r2" alt="note">
          <img src="note.png" class="ambient-note note-r3" alt="note">
        </div>

        <!-- Dynamic Floating Notes Burst Layer -->
        <div class="dynamic-notes-layer" id="dynamicNotesLayer"></div>
      </div>

      <!-- 3 White Rounded Status Pills Matching Reference Mockup -->
      <div class="status-row">
        <div class="mockup-pill chord-pill">
          <div class="pill-label">CHORD</div>
          <div class="pill-val" id="chordName">A</div>
        </div>

        <div class="mockup-pill hands-pill">
          <div class="pill-label">No. of hand tracked</div>
          <div class="pill-val" id="handCount">0</div>
        </div>

        <div class="mockup-pill state-pill" id="statePill">
          <div class="pill-label">Ready?</div>
          <div class="pill-val" id="status">Ready</div>
        </div>
      </div>

      <!-- Simple Camera Action Button -->
      <div class="action-row">
        <button id="cameraButton" class="btn-start">Start camera</button>
      </div>

      <!-- Bottom Plain Text Guide -->
      <footer class="plain-guide">
        <div class="guide-title">Fretting Hand Guide (Left Hand):</div>
        <div class="guide-text">
          Thumb: <b>E</b> &nbsp;&bull;&nbsp;
          Index: <b>A</b> &nbsp;&bull;&nbsp;
          Middle: <b>D</b> &nbsp;&bull;&nbsp;
          Ring: <b>G</b> &nbsp;&bull;&nbsp;
          Pinky: <b>C</b> &nbsp;&bull;&nbsp;
          Thumb+Index: <b>Am</b> &nbsp;&bull;&nbsp;
          Middle+Ring: <b>Dm</b> &nbsp;&bull;&nbsp;
          Ring+Pinky: <b>Em</b> &nbsp;&bull;&nbsp;
          Thumb+Middle: <b>Gm</b>
        </div>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
